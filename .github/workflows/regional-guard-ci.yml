# rPatchur regional compatibility guard regression
name: rPatchur Region/Channel Guard
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/regional-guard-ci.yml"
  push:
    branches: [master]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/regional-guard-ci.yml"
permissions:
  contents: read
jobs:
  rust-regressions:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Normalize formatting in disposable CI checkout
        shell: pwsh
        run: cargo fmt --all
      - name: Compile and run rPatchur safety tests
        shell: pwsh
        run: cargo test --locked --bin rpatchur
      - name: Upload locked Cargo graph for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpatchur-resolved-cargo-lockfile
          path: Cargo.lock
          if-no-files-found: warn
          retention-days: 7
