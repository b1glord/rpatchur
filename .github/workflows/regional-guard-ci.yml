# rPatchur regional compatibility guard regression
name: rPatchur Region/Channel Guard
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/regional-guard-ci.yml"
  push:
    branches: [master]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/regional-guard-ci.yml"
permissions:
  contents: read
jobs:
  rust-regressions:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format all Rust sources
        shell: pwsh
        run: cargo fmt -- --check
      - name: Compile and run rPatchur safety tests
        shell: pwsh
        run: cargo test --bin rpatchur
